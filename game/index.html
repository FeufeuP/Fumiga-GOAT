<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FUMIGA — Colônia Eterna</title>
<meta name="description" content="Roguelite de colônia de formigas em pixel art. Sobreviva às ondas, evolua sua colônia.">
<link rel="stylesheet" href="css/style.css">
<!-- INSTALÁVEL: o manifest desta versão (teclado e mouse). Instalar por aqui
     cria o app "FUMIGA — Colônia Eterna (PC)"; abrir o ícone leva à página do
     app, que oferece o download para jogar sem internet. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../app/icons/apple-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="../app/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../app/icons/favicon-16.png">
<meta name="theme-color" content="#1d1127">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FUMIGA PC">
</head>
<body>
<div id="frame">
  <canvas id="game" width="960" height="540"></canvas>
  <!-- Scanlines retrô (OPÇÕES → VÍDEO): cobertura sobre o canvas, sem clique -->
  <div id="scan" hidden></div>
  <!-- Filtro PS1 (OPÇÕES → VÍDEO): canvas de pós-processamento por cima do
       jogo — dither Bayer 4x4 + 15 bits, sem tocar nos pixels do #game. -->
  <canvas id="psx" hidden></canvas>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
